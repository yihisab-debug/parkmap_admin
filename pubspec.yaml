name: parkmap_admin
description: ParkMap — приложение администратора (места, отзывы, жалобы, штрафы)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase / Google Sign-In
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.4.0

  # Карта (выбор координат парковки кликом)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Геокодинг (поиск адреса → координаты и обратно, через Positionstack)
  http: ^1.2.2

  # Утилиты
  intl: ^0.19.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
